name: Android Security Toolkit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ast-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Python environment
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build

      - name: Check syntax and high-confidence lint errors
        run: |
          python -m compileall -q src tests
          ruff check --select E4,E7,E9,F63,F7,F82 src tests

      - name: Run automated tests
        run: python -m pytest -q

      - name: Validate package dependencies and build
        run: |
          python -m pip check
          python -m build

      - name: Check current tree for release hygiene
        run: python scripts/release_audit.py --mode development
