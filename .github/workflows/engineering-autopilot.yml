name: AST Autonomous Build Health

on:
  # Scheduled runs execute only from the default branch, using UTC.
  # 04:37 UTC = 05:37 in Lagos (UTC+1).
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ast-autopilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -e '.[dev]' build
          python -m pip check
      - name: Syntax, lint and synthetic regression tests
        run: |
          python -m compileall -q src tests
          ruff check --select E4,E7,E9,F63,F7,F82 src tests
          python -m pytest -q
      - name: Validate source-only release history
        run: python scripts/release_audit.py --mode release
      - name: Build package
        run: python -m build

  dependency-audit:
    name: Installed dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install and audit
        run: |
          python -m pip install -e '.[dev]' pip-audit
          python -m pip_audit --local

  report:
    name: Deduplicated build-health issue
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [verify, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Track failures without creating repeated issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title='[AUTOPILOT] Scheduled build health requires attention'
          issue_number="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title --jq '.[] | select(.title == "[AUTOPILOT] Scheduled build health requires attention") | .number' | head -n 1)"
          status="Source checks: $VERIFY_RESULT; dependency audit: $AUDIT_RESULT"
          if [[ "$VERIFY_RESULT" == 'success' && "$AUDIT_RESULT" == 'success' ]]; then
            if [[ -n "$issue_number" ]]; then
              gh issue comment "$issue_number" --repo "$REPO" \
                --body "Automatically resolved. $status. Run: $RUN_URL"
              gh issue close "$issue_number" --repo "$REPO"
            fi
          elif [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$REPO" \
              --body "$status. Investigate: $RUN_URL"
          else
            gh issue create --repo "$REPO" --title "$title" \
              --body "$status. Investigate: $RUN_URL. Do not bypass failed safety gates."
          fi
