[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ahmad-ib-android-security-toolkit"
version = "0.1.0"
description = "Open-source Android application security assessment toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
    "typer>=0.16",
    "rich>=14.0",
    "androguard>=4.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12"
]

[project.scripts]
ahmad-sec = "ahmad_sec.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
